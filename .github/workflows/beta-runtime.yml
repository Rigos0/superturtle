name: Managed Codex Runtime

on:
  push:
    branches:
      - managed-codex
  workflow_dispatch:

concurrency:
  group: managed-codex-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-managed-codex-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: super_turtle
    outputs:
      should_publish: ${{ steps.preflight.outputs.should_publish }}
      package_version: ${{ steps.version.outputs.package_version }}
      runtime_install_spec: ${{ steps.version.outputs.runtime_install_spec }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}
      template_channel: ${{ steps.version.outputs.template_channel }}
      template_version_tag: ${{ steps.version.outputs.template_version_tag }}
    steps:
      - id: preflight
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.should_publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.should_publish == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - id: version
        if: steps.preflight.outputs.should_publish == 'true'
        run: node scripts/prepare-beta-release.mjs >> "$GITHUB_OUTPUT"
      - if: steps.preflight.outputs.should_publish == 'true'
        run: bash tests/npm-package-smoke.sh
      - if: steps.preflight.outputs.should_publish == 'true'
        run: npm publish --tag managed-codex --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-managed-codex-template:
    if: ${{ needs.publish-managed-codex-package.result == 'success' && needs.publish-managed-codex-package.outputs.should_publish == 'true' }}
    needs:
      - publish-managed-codex-package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: super_turtle
    steps:
      - id: preflight
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "should_publish_template=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish_template=true" >> "$GITHUB_OUTPUT"
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.should_publish_template == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.preflight.outputs.should_publish_template == 'true'
      - if: steps.preflight.outputs.should_publish_template == 'true'
        run: bun install --frozen-lockfile
      - if: steps.preflight.outputs.should_publish_template == 'true'
        run: bun run e2b:template:build
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          SUPERTURTLE_E2B_TEMPLATE_CHANNEL: ${{ needs.publish-managed-codex-package.outputs.template_channel }}
          SUPERTURTLE_E2B_TEMPLATE_TAGS: ${{ needs.publish-managed-codex-package.outputs.sha_tag }}
          SUPERTURTLE_E2B_TEMPLATE_VERSION: ${{ needs.publish-managed-codex-package.outputs.template_version_tag }}
          SUPERTURTLE_RUNTIME_INSTALL_SPEC: ${{ needs.publish-managed-codex-package.outputs.runtime_install_spec }}
